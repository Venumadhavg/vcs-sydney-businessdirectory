<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vasavi Club Sydney – Business Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #E8650A;
    --saffron-light: #FFF0E6;
    --deep: #1A1014;
    --card-bg: #FDFAF8;
    --border: #EDE0D8;
    --text: #2C1810;
    --muted: #9A7060;
    --green: #2D7A4F;
    --tag-bg: #FFF4ED;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #F7F0EB;
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--deep);
    padding: 22px 24px 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .header-top-border {
    height: 4px;
    background: linear-gradient(90deg, #C4272F 0%, #E8650A 33%, #F5C518 66%, #C4272F 100%);
    position: absolute;
    top: 0; left: 0; right: 0;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .logo-emblem {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }
  .matha-frame {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2.5px solid #F5C518;
    box-shadow: 0 0 0 3px rgba(245,197,24,0.2), 0 0 12px rgba(232,101,10,0.35);
    overflow: hidden;
    background: #1a0a00;
  }
  .matha-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .logo-sri {
    font-family: 'Noto Sans Telugu', serif;
    font-size: 11px;
    color: rgba(245,197,24,0.7);
    letter-spacing: 0.5px;
    margin-bottom: 1px;
  }
  .logo-text-block { text-align: left; }
  .logo-telugu {
    font-family: 'Noto Sans Telugu', 'Mandali', serif;
    font-size: 22px;
    color: #F5C518;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .logo-english {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 26px);
    color: #fff;
    line-height: 1.2;
    letter-spacing: 0.5px;
  }
  .logo-english span { color: var(--saffron); }
  header p {
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-divider {
    width: 60px;
    height: 1px;
    background: rgba(245,197,24,0.35);
    margin: 10px auto 0;
  }

  /* SEARCH + FILTER BAR */
  .controls {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border 0.2s;
  }
  input[type="text"]:focus { border-color: var(--saffron); }
  select {
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    outline: none;
    min-width: 160px;
    transition: border 0.2s;
  }
  select:focus { border-color: var(--saffron); }

  /* STATS BAR */
  .stats {
    max-width: 900px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .count-badge {
    background: var(--saffron);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .stats-text { font-size: 13px; color: var(--muted); }

  /* CARDS GRID */
  .grid {
    max-width: 900px;
    margin: 16px auto 40px;
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    transition: transform 0.18s, box-shadow 0.18s;
    cursor: default;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(232,101,10,0.12);
    border-color: #D4B5A0;
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--saffron-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .card-title-wrap { flex: 1; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
  }
  .card-category {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--saffron);
    margin-top: 3px;
  }
  .card-divider {
    height: 1px;
    background: var(--border);
  }
  .card-info { display: flex; flex-direction: column; gap: 7px; }
  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
  }
  .info-icon { color: var(--muted); flex-shrink: 0; margin-top: 1px; }
  .info-text { color: var(--text); line-height: 1.4; }
  .info-text a {
    color: var(--saffron);
    text-decoration: none;
    word-break: break-all;
  }
  .info-text a:hover { text-decoration: underline; }
  .comment-box {
    background: #FFF9F5;
    border-left: 3px solid var(--saffron);
    border-radius: 0 8px 8px 0;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    font-style: italic;
  }
  .cta-row {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }
  .btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-call {
    background: #EDF7F1;
    color: var(--green);
    border: 1.5px solid #C0DFD0;
  }
  .btn-call:hover { background: #D6EFE2; }
  .btn-web {
    background: var(--saffron-light);
    color: var(--saffron);
    border: 1.5px solid #F4C9A8;
  }
  .btn-web:hover { background: #FDDEC5; }

  /* EMPTY STATE */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  /* SHARE BANNER */
  .share-banner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .share-inner {
    background: var(--deep);
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .share-text { color: rgba(255,255,255,0.8); font-size: 13px; }
  .share-text strong { color: white; }
  .share-btn {
    background: #25D366;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .share-btn:hover { background: #1DA851; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    header { padding: 20px 16px 16px; }
  }
</style>
</head>

];

const categoryIcons = {
  "Construction": "🏗️",
  "Indian Grocery": "🛒",
  "Party Hire": "🎉",
  "Real Estate": "🏠",
  "Private Transfers": "🚗",

function normalizeLink(url) {
  if (!url) return null;
  if (url.startsWith('http')) return url;
  return 'https://' + url;
}

function renderCard(b) {
  const icon = categoryIcons[b.category] || "💼";
  const tel = b.phone.replace(/\s+/g,'').replace(/\//g, '');
  const linkUrl = normalizeLink(b.link);

// Populate category filter
const cats = [...new Set(businesses.map(b => b.category))].sort();
const sel = document.getElementById('categoryFilter');
cats.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  sel.appendChild(opt);
});

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const filtered = businesses.filter(b => {
    const matchQ = !q || [b.name, b.category, b.address, b.contact, b.comment].some(f => f && f.toLowerCase().includes(q));
    const matchC = !cat || b.category === cat;
    return matchQ && matchC;
  });
  const grid = document.getElementById('grid');
  document.getElementById('countBadge').textContent = filtered.length;
  document.getElementById('statsText').textContent = filtered.length === 1 ? 'business found' : 'businesses listed';
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>No matches found</h3><p>Try a different search or category</p></div>`;
  } else {
    grid.innerHTML = filtered.map(renderCard).join('');
  }
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);

// WhatsApp share
document.getElementById('waShareBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const pageUrl = window.location.href;
  const msg = encodeURIComponent("📋 *Vasavi Club Sydney – Business Directory*\n\nSupport our community members! Browse all VCS member businesses here:\n" + pageUrl);
  window.open("https://wa.me/?text=" + msg, "_blank");
});

render();
</script>
